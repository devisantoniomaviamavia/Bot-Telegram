<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Separador de Vocais</title>
  <style>
    body { font-family: Arial, sans-serif; background:#0f172a; color:#e2e8f0; padding:2rem; }
    .card { max-width:520px; margin:0 auto; background:#1e293b; border-radius:12px; padding:1.5rem; }
    h1 { font-size:1.5rem; margin:0 0 1rem; }
    label { display:block; margin-top:1rem; }
    input, select, button { width:100%; margin-top:.5rem; padding:.75rem; border-radius:8px; border:1px solid #334155; background:#0f172a; color:#e2e8f0; }
    button { background:#22c55e; border:none; font-weight:bold; cursor:pointer; }
    .error { background:#7f1d1d; color:#fecaca; padding:.75rem; border-radius:8px; margin-top:1rem; }
    .hint { font-size:.9rem; color:#94a3b8; margin-top:.75rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Separar voz e instrumental</h1>
    <form method="post" enctype="multipart/form-data">
      <label for="audio">Arquivo de áudio</label>
      <input id="audio" name="audio" type="file" accept=".mp3,.wav,.flac,.ogg,.m4a" required>

      <label for="mode">Tipo de separação</label>
      <select id="mode" name="mode">
        <option value="vocals">Extrair vocais (aproximação)</option>
        <option value="instrumental">Extrair instrumental (aproximação)</option>
      </select>

      <button type="submit">Processar e baixar</button>
    </form>

    {% if error %}
      <p class="error">{{ error }}</p>
    {% endif %}

    <p class="hint">Obs: este método usa cancelamento de fase e funciona melhor em faixas estéreo com voz centralizada.</p>
  </div>
</body>
</html>
